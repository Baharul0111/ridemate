[project]
name = "ridemate-api"
version = "1.0.0"
description = "RideMate backend: auth, limits, credit budget, Muse Spark Open gateway and ONDC buyer, hosted as a Modal web app."
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "httpx>=0.27",
    "openai>=1.55",
    "google-auth>=2.36",
    "requests>=2.32",
    "pynacl>=1.5",
    "cryptography>=43",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "modal>=1.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "bandit>=1.7",
    "ruff>=0.7",
    "uvicorn>=0.32",
    # The Template Doctor's own runtime dependencies (requirements-doctor.lock, installed in the dispatcher's
    # image): tests import tools.template_doctor from the repo root the way the weekly drift run does.
    "google-re2>=1.1",
    "jsonschema>=4.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ridemate_api"]
