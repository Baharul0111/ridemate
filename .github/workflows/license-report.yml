# Third-party licence report: backend + eval (uv) and the Android release runtime classpath
# (jk1 dependency-license-report plugin), combined by tools/license_report.py into one artifact.
name: Licence report

on:
  push:
    branches: [main]
    paths:
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "eval/pyproject.toml"
      - "eval/uv.lock"
      - "android/gradle/libs.versions.toml"
      - "android/**/*.gradle.kts"
      - "tools/license_report.py"
      - ".github/workflows/license-report.yml"
  pull_request:
    paths:
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "eval/pyproject.toml"
      - "eval/uv.lock"
      - "android/gradle/libs.versions.toml"
      - "android/**/*.gradle.kts"
      - "tools/license_report.py"
      - ".github/workflows/license-report.yml"
  schedule:
    - cron: "41 4 1 * *" # monthly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  report:
    name: Combined licence report
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
          add-job-summary: never

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            eval/uv.lock

      - name: Build the report
        # Shipped code (backend runtime deps, the APK's release classpath) must not be limited to
        # network-copyleft or source-available licences.
        run: >-
          python3 tools/license_report.py --sync --out build/license-report
          --deny '(?i)\bAGPL|Affero|\bSSPL|Server Side Public|\bBUSL|Business Source|Commons Clause'

      - name: Job summary
        if: ${{ !cancelled() && hashFiles('build/license-report/LICENSES.md') != '' }}
        run: awk '/^## (android|backend|eval)$/ {exit} {print}' build/license-report/LICENSES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: license-report
          path: build/license-report/
          if-no-files-found: error
          retention-days: 90
