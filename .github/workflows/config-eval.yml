# Remote Config defaults (schemas, RE2 compile, bundled copies current) and the eval + config test suites on
# synthetic and recorded fixtures. Never the private golden set, never a model call (architecture L6).
name: Config and eval

on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "eval/**"
      - "android/app/src/main/assets/**"
      - "android/app/src/main/res/xml/remote_config_defaults.xml"
      - "tools/ci/run_config_eval.sh"
      - ".github/workflows/config-eval.yml"
  pull_request:
    paths:
      - "config/**"
      - "eval/**"
      - "android/app/src/main/assets/**"
      - "android/app/src/main/res/xml/remote_config_defaults.xml"
      - "tools/ci/run_config_eval.sh"
      - ".github/workflows/config-eval.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate defaults, run eval + config tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            eval/uv.lock
            config/uv.lock

      - name: Validate Remote Config defaults and run tests
        run: bash tools/ci/run_config_eval.sh
