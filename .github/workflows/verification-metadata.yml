name: Update dependency verification

# Manual job: adds the Linux-only artifacts (and anything else CI resolves) to android/gradle/verification-metadata.xml,
# starting from the committed file, and uploads the merged file for the owner to review and commit. Gradle keeps every
# existing entry and only appends what is missing.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-metadata
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Append missing checksums (same task set as CI)
        run: >-
          ./gradlew --no-daemon --console=plain --write-verification-metadata sha256
          :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
          :core:compileKotlin :app:compileDebugKotlin help -PrequireFixtures=true
          -Dorg.gradle.jvmargs="-Xmx5g -Dfile.encoding=UTF-8"
      - name: Prove the merged file verifies strictly
        run: ./gradlew --no-daemon --console=plain --dependency-verification=strict help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata
          path: android/gradle/verification-metadata.xml
          retention-days: 7
