# Android: unit + replay + Robolectric (Room MigrationTestHelper) + accuracy tests on recorded/synthetic
# fixtures, Android Lint (security checks; SARIF to code scanning) and the debug APK.
# Public CI: no secrets, never the private golden set, never a model call, no signing (architecture L6, §4.2).
name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "eval/**"
      - "config/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "eval/**"
      - "config/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Tests, lint, debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write # upload the Android Lint SARIF to code scanning
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency verification metadata is present
        run: |
          if [[ ! -f gradle/verification-metadata.xml ]]; then
            echo "::error file=android/gradle/verification-metadata.xml::Missing. Run tools/update_dependency_verification.sh and commit the result."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (runner-provided; accept licences, ensure platform 36)
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          add-job-summary: on-failure

      - name: Unit, replay, migration and accuracy tests; lint; assemble debug
        # --continue: run lint and assemble even when a test fails, so every report is produced.
        run: >-
          ./gradlew --dependency-verification=strict --continue --stacktrace
          :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          -PrequireFixtures=true

      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            android/core/build/reports/tests/
            android/core/build/test-results/
            android/app/build/reports/tests/
            android/app/build/test-results/
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Android Lint SARIF to code scanning
        # Fork pull requests get a read-only token, so only same-repository events upload.
        if: >-
          ${{ !cancelled()
          && hashFiles('android/app/build/reports/lint-results-debug.sarif') != ''
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: android/app/build/reports/lint-results-debug.sarif
          category: android-lint

  dependency-submission:
    # Sends the resolved Gradle graph to GitHub so Dependabot alerts and dependency review cover Gradle.
    name: Gradle dependency graph
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # required by the dependency submission API; this job builds nothing
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-root-directory: android
          cache-provider: basic
          # Resolves every configuration, including ones no build uses; strict verification stays in "build".
          additional-arguments: --dependency-verification=lenient
